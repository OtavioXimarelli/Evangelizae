openapi: 3.1.0
info:
  title: Evangelizae API
  version: 1.0.0-beta.1
  description: Contract mirror for the separately maintained Spring API. The backend repository is the canonical source.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /liturgy/today:
    get:
      operationId: getDailyLiturgy
      summary: Return the Catholic liturgy for the current date in the requested timezone.
      parameters:
        - name: timezone
          in: query
          required: true
          schema: {type: string, example: America/Sao_Paulo}
        - name: locale
          in: query
          required: true
          schema: {type: string, enum: [pt-BR]}
      responses:
        '200':
          description: Daily liturgy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DailyLiturgy'}
        '503':
          description: Neither the provider nor a same-date cache is available.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
components:
  schemas:
    DailyLiturgy:
      type: object
      required: [date, title, color, prayers, groups, source]
      properties:
        date: {type: string, format: date}
        title: {type: string}
        color: {type: string, enum: [GREEN, WHITE, RED, PURPLE, ROSE]}
        prayers:
          type: object
          properties:
            collect: {type: string}
            offerings: {type: string}
            communion: {type: string}
        groups:
          type: array
          items:
            type: object
            required: [kind, items]
            properties:
              kind: {type: string, enum: [FIRST_READING, PSALM, SECOND_READING, GOSPEL, EXTRA]}
              items:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [title, text]
                  properties:
                    title: {type: string}
                    reference: {type: string}
                    text: {type: string}
                    refrain: {type: string}
        source:
          type: object
          required: [provider, fetchedAt, freshness]
          properties:
            provider: {type: string}
            fetchedAt: {type: string, format: date-time}
            freshness: {type: string, enum: [LIVE, CACHED]}
    ApiError:
      type: object
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp: {type: string, format: date-time}
        status: {type: integer}
        error: {type: string}
        code: {type: string, example: LITURGY_UNAVAILABLE}
        message: {type: string}
        path: {type: string}
